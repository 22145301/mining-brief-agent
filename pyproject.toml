[project]
name = "mining-brief"
version = "0.1.0"
description = "矿权日报 Agent —— 每个事实都能回溯到原始来源的 Markdown 日报"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "mcp==1.16.0",
    "langgraph==1.0.2",
    "pydantic==2.11.9",
    "httpx==0.28.1",
    "structlog==25.4.0",
    "typer==0.19.2",
    "openai==2.2.0",
    # Windows / macOS 上没有 IANA 时区库，`zoneinfo.ZoneInfo("Asia/Shanghai")` 会抛
    # ZoneInfoNotFoundError。价格模块要用北京时间判交易日（见 prices.py），所以这个
    # 依赖是**功能性的**，不是可选的 —— 少了它，陌生人 clone 下来第一次查价就崩。
    "tzdata==2025.2",
]

[project.optional-dependencies]
# 浏览器只给 LME 用（Cloudflare 拦掉全部 HTTP 客户端），因此刻意不进默认安装。
# 缺浏览器时必须明确报错，不静默降级 —— 见 ADR-0003 与工单 04。
browser = ["playwright==1.55.0"]
# PDF 解析只在真下载真解析的用例里用到（完整 PDF 不入库），所以也不是默认依赖。
pdf = ["pypdf==6.1.3"]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "ruff==0.14.0",
    "mypy==1.18.2",
]

[project.scripts]
mining-brief = "mining_brief.cli:main"
# 三个 server 各有一个同名入口（名字照题面，不自创）。`mcp-config.json` 挂的就是它们 ——
# 挂 `python -m mining_brief.servers.xxx` 也能跑，但那样宿主配置里就得出现一条路径假设，
# 而控制台脚本由 `uv run` / `uv tool install` 负责把名字放到 PATH 上。
mining-news-mcp = "mining_brief.servers.news_server:main"
lme-price-mcp = "mining_brief.servers.price_server:main"
mineral-pdf-mcp = "mining_brief.servers.mineral_pdf_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mining_brief"]

# ---------------------------------------------------------------------------
# Ruff：lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".scratch", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "T20",  # flake8-print —— 靠 lint 挡住裸 print，不靠自觉（CLAUDE.md 硬性要求）
    "SIM",  # flake8-simplify
    "RUF",
]
# 本仓库的注释、docstring 与面向用户的文案一律是中文，全角标点（，。：（））是正确
# 写法而非笔误。RUF001/002/003 会把这些逐条报成"ambiguous unicode"，是纯噪音。
ignore = [
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
]
# cli.py 要把产物路径写到 stdout（PRD §5.3 的硬契约）。它用的是显式的
# sys.stdout.write 而不是 print，因此这条豁免实际不会被用到 —— 留在这里是为了
# 在有人"顺手"把 stdout 契约改成 print 时报错，而不是悄悄放行。
#
# B008：Typer 的**唯一**写法就是把 `typer.Option(...)` / `typer.Argument(...)` 写在
# 参数默认值里（它靠读签名拿元数据）。这是 bugbear 对 Typer 的已知误报，不是我们
# 真的在默认值里做副作用 —— 因此只对 cli.py 关掉，其余文件照常受管。
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"mining_brief/cli.py" = ["B008"]

# ---------------------------------------------------------------------------
# 格式化：**Ruff 一家**，lint 与 format 同一个配置源。
#
# 为什么不挂 Black（实测，不是口味问题）：两个工具在**同一个文件**上给出不同输出，
# 谁都不肯接受对方的结果。分歧集中在一类写法上 —— 推导式里的三元表达式：
#
#   # ruff format（本仓库现在的样子）          # black --check 想把它改成：
#   updated = tuple(                          updated = tuple(
#       x if cond else y                          (
#       for x in xs                                   x if cond else y
#   )                                             )
#                                                 for x in xs
#                                             )
#
# 实测（手边的 black 24.10）把 `black` 改完的文件再交给 `ruff format --check`，
# 它还要改回去（反之亦然）。两个都挂，
# 结果是 CI 必红或者两个人互相把对方的 diff 洗掉 —— 不是"更严格"，是"没有唯一答案"。
# 留 Ruff 的理由：它同时是 lint 与 format 的**唯一配置源**，且已在 `ruff check` 里
# 按文件配过豁免（见上），少一个工具、少一处会漂移的口径。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# mypy：类型检查。它同时充当 MCP 工具返回契约的书面化（PRD §11）。
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["mining_brief", "tests"]
strict = true
warn_unreachable = true
show_error_codes = true
# langgraph 的类型桩不完整，且它的节点装饰器在 strict 下会连坐我们自己的代码。
# 只对本项目自己的模块要类型完整，第三方库放宽到"有就行"。
[[tool.mypy.overrides]]
module = ["langgraph.*", "mcp.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest：默认套件必须离线、确定性（ADR-0001 / ADR-0002）
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not network and not stdio'"
markers = [
    "network: 真下载真解析，需要网络（PRD §13 R4）。默认套件排除。",
    "stdio: 真起 MCP 子进程走 stdio 传输（ADR-0001）。默认套件排除。",
]
