name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: lint · format · types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: Ruff lint
        run: uv run ruff check .
      # 格式化只有一个权威：ruff。Black 与 ruff format 对**同一份文件**给出不同结果
      # （推导式里的三元表达式加不加括号），两个都挂等于让 CI 取决于谁先跑 —— 见
      # pyproject.toml 里 `[tool.ruff]` 上方那段实测记录。
      - name: Ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    name: pytest（默认离线套件）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras --frozen
      # 默认套件刻意不联网：外部网站抽风不该让 CI 变红（User Story 31）。
      # 真下载真解析的用例带 @pytest.mark.network，由 addopts 排除。
      - run: uv run pytest -v
      # stdio 那一档被 addopts 排除在默认套件外，但它**不发网络请求**，只起真子进程，
      # 所以在 CI 上跑得动，也正该在这里跑：它守的是"挂进宿主后能不能取到数据"
      # （录播根按安装位置推、日志只走 stderr）—— 这两条恰恰最容易在别人机器上翻车。
      - name: pytest（stdio 真子进程）
        run: uv run pytest -m stdio -v
