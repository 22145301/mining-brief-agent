name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: lint · format · types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Black
        run: uv run black --check .
      - name: mypy
        run: uv run mypy

  test:
    name: pytest（默认离线套件）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras --frozen
      # 默认套件刻意不联网：外部网站抽风不该让 CI 变红（User Story 31）。
      # 真下载真解析的用例带 @pytest.mark.network，由 addopts 排除。
      - run: uv run pytest -v
